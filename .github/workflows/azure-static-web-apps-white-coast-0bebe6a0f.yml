name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
      github.event.action != 'closed')

    runs-on: ubuntu-24.04
    name: Build and Deploy Job

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Build application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_AZURE_CLIENT_ID: ${{ secrets.VITE_AZURE_CLIENT_ID }}
          VITE_AZURE_TENANT_ID: ${{ secrets.VITE_AZURE_TENANT_ID }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          MAX_EXPORT_SIZE: ${{ secrets.MAX_EXPORT_SIZE }}
          EXPORT_CHUNK_SIZE: ${{ secrets.EXPORT_CHUNK_SIZE }}
          EXPORT_JOB_CHUNK_SIZE: ${{ secrets.EXPORT_JOB_CHUNK_SIZE }}
          EXPORT_MAX_CHUNKS_PER_INVOKE: ${{ secrets.EXPORT_MAX_CHUNKS_PER_INVOKE }}

      - name: Install OIDC dependencies
        run: npm install --no-save @actions/core@1.6.0 @actions/http-client

      - name: Get ID Token
        uses: actions/github-script@v7
        id: idtoken
        with:
          script: |
            const core = require('@actions/core');
            return await core.getIDToken();
          result-encoding: string

      - name: Deploy application
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_COAST_0BEBE6A0F }}
          action: upload

          # La aplicación ya fue compilada anteriormente.
          app_location: dist
          api_location: ""
          output_location: ""
          skip_app_build: true

          github_id_token: ${{ steps.idtoken.outputs.result }}

  close_pull_request_job:
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed'

    runs-on: ubuntu-24.04
    name: Close Pull Request Job

    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_COAST_0BEBE6A0F }}
          action: close